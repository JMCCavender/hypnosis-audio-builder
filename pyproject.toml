[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypnosis-audio-builder"
version = "1.1.0"
description = "A Python audio production tool for creating self-hypnosis tracks with binaural beats, ambient music, and subliminal messaging"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Claude (Anthropic)" },
]
keywords = ["hypnosis", "binaural-beats", "audio", "subliminal", "theta-waves", "self-improvement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "pydub>=0.25.1",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tts = ["pyttsx3>=2.90"]
dev = ["pytest>=7.0"]

[project.scripts]
hypnosis = "hypnosis_audio_builder:main"

[project.urls]
Homepage = "https://github.com/JMCCavender/hypnosis-audio-builder"
Repository = "https://github.com/JMCCavender/hypnosis-audio-builder"
Issues = "https://github.com/JMCCavender/hypnosis-audio-builder/issues"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools]
py-modules = ["hypnosis_audio_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
